name: SwiftPM
on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swiftpm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  macros:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
      - name: Macro tests on host
        run: python3 Scripts/test.py macros
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-test-logs
          path: .build/ci/*.log
  ios:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
      - name: Test SwiftPM package on iOS
        run: python3 Scripts/test.py ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            .build/ci/*.log
            .build/ci/*.xcresult
  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
      - name: Runtime and macro tests
        run: |
          set -o pipefail
          mkdir -p .build/ci
          swift test 2>&1 | tee .build/ci/macos-tests.log
          python3 Scripts/test.py negative
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-test-logs
          path: .build/ci/*.log
  release:
    if: github.ref_type == 'tag'
    needs: [macros, ios, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create Release after tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
